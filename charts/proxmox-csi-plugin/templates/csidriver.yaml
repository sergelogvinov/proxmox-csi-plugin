apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.provisionerName }}
spec:
  attachRequired: true
  podInfoOnMount: true
  storageCapacity: true
  {{- if .Values.selinux.seLinuxMount }}
  {{- if not .Values.selinux.enabled }}
  {{- fail "selinux.seLinuxMount requires selinux.enabled=true: without /etc/selinux/config in the node plugin, mount drops the context= option" }}
  {{- end }}
  seLinuxMount: true
  {{- end }}
  volumeLifecycleModes:
  - Persistent
