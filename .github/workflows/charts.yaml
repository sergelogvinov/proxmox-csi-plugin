name: Helm chart check

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "!charts/proxmox-csi-plugin/README.md.gotmpl"

jobs:
  helm-lint:
    name: Helm chart check
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Install chart-testing tools
        id: lint
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run helm chart linter
        run: ct --config hack/ct.yml lint
      - name: Run helm template
        run: make helm-unit
