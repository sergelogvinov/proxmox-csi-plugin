---
# See https://docs.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore:"
    open-pull-requests-limit: 8
    rebase-strategy: disabled
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "actions/*"
          - "azure/*"
      docker:
        patterns:
          - "docker/*"
      other:
        patterns:
          - "golangci/*"

  - package-ecosystem: "gomod"
    directory: "/"
    commit-message:
      prefix: "chore:"
    open-pull-requests-limit: 8
    rebase-strategy: disabled
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      k8s.io:
        patterns:
          - "k8s.io/api"
          - "k8s.io/apimachinery"
          - "k8s.io/client-go"
          - "k8s.io/cloud-provider"
          - "k8s.io/component-base"
          - "k8s.io/mount-utils"

  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "chore:"
    open-pull-requests-limit: 8
    rebase-strategy: disabled
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:10"
      timezone: "UTC"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    commit-message:
      prefix: "chore:"
    open-pull-requests-limit: 8
    rebase-strategy: disabled
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:10"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      sig-storage:
        patterns:
          - "registry.k8s.io/sig-storage/*"
